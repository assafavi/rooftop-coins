<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15243a">

  <link rel="apple-touch-icon" sizes="180x180" href="/rooftop-coins/rooftop-coins-icon.png">
  
  <title>Rooftop Coins</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#8fd5ff;color:#fff}
    body{min-height:100vh;overflow-x:hidden;background:linear-gradient(#70c9ff 0%,#bdeaff 53%,#f4b56b 100%)}
    .scene{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 18px 44px;overflow:hidden}
    .sun{position:absolute;width:120px;height:120px;border-radius:50%;background:#ffe59b;right:9%;top:9%;box-shadow:0 0 50px rgba(255,230,150,.75)}
    .cloud{position:absolute;background:rgba(255,255,255,.76);height:28px;border-radius:30px;filter:blur(.2px)}
    .cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
    .cloud:before{width:46px;height:46px;left:18px;bottom:4px}.cloud:after{width:58px;height:58px;left:54px;bottom:2px}
    .c1{width:130px;left:7%;top:15%}.c2{width:150px;right:17%;top:27%;transform:scale(.8)}
    .skyline{position:absolute;left:0;right:0;bottom:0;height:37%;display:flex;align-items:flex-end;gap:8px;opacity:.85}
    .b{flex:1;min-width:38px;background:linear-gradient(90deg,#29384a,#42566c);border-top:4px solid #566d84;box-shadow:inset -8px 0 rgba(0,0,0,.12)}
    .b:after{content:"";display:block;height:100%;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(255,225,128,.35) 14px 19px,transparent 19px 31px),repeating-linear-gradient(0deg,transparent 0 20px,rgba(255,225,128,.22) 20px 26px,transparent 26px 42px)}
    .panel{position:relative;z-index:3;width:min(650px,100%);text-align:center;padding:30px 24px 26px;border-radius:28px;background:rgba(14,28,47,.89);border:1px solid rgba(255,255,255,.25);box-shadow:0 24px 70px rgba(17,35,56,.38);backdrop-filter:blur(8px)}
    .coin{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:900;color:#8b5d00;background:radial-gradient(circle at 35% 30%,#fff4a5 0 8%,#ffd53d 30%,#e99a00 75%);border:6px solid #ffc62f;box-shadow:0 6px 0 #a96600,0 0 26px rgba(255,204,45,.5)}
    h1{margin:5px 0 2px;font-size:clamp(38px,8vw,68px);line-height:.95;letter-spacing:-2px;text-shadow:0 4px 0 rgba(0,0,0,.18)}
    .tag{margin:10px 0 24px;color:#dce9f5;font-size:clamp(14px,3.2vw,18px)}
    .versions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .version{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:154px;padding:18px 14px;border-radius:20px;text-decoration:none;color:white;border:2px solid rgba(255,255,255,.28);transition:transform .15s ease,filter .15s ease;background:linear-gradient(145deg,#3478b9,#215386);box-shadow:0 8px 0 #153653}
    .version.v3{background:linear-gradient(145deg,#f2a629,#d86e17);box-shadow:0 8px 0 #8d4211}
    .version.v4{background:linear-gradient(145deg,#8e59d6,#5b35a8);box-shadow:0 8px 0 #39246f}
    .version strong{font-size:30px;line-height:1}.version span{margin-top:9px;font-size:14px;opacity:.9}.version em{font-style:normal;margin-top:12px;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.18);font-weight:800;font-size:12px;letter-spacing:.5px}
    .version:hover{transform:translateY(-3px);filter:brightness(1.06)}.version:active{transform:translateY(4px)}
    .note{margin:23px 0 0;color:#bcd0df;font-size:13px;line-height:1.45}
    @media(max-width:700px){.scene{padding:18px 12px 34px}.panel{padding:24px 15px 22px;border-radius:22px}.versions{grid-template-columns:1fr;gap:14px}.version{min-height:118px}.coin{width:62px;height:62px;font-size:36px}.skyline{height:30%}}
  </style>
</head>
<body>
  <main class="scene">
    <div class="sun" aria-hidden="true"></div><div class="cloud c1" aria-hidden="true"></div><div class="cloud c2" aria-hidden="true"></div>
    <div class="skyline" aria-hidden="true">
      <div class="b" style="height:45%"></div><div class="b" style="height:68%"></div><div class="b" style="height:52%"></div><div class="b" style="height:83%"></div><div class="b" style="height:61%"></div><div class="b" style="height:92%"></div><div class="b" style="height:58%"></div><div class="b" style="height:76%"></div><div class="b" style="height:48%"></div><div class="b" style="height:70%"></div>
    </div>
    <section class="panel" aria-labelledby="title">
      <div class="coin" aria-hidden="true">$</div>
      <h1 id="title">ROOFTOP<br>COINS</h1>
      <p class="tag">Choose which version you want to play.</p>
      <div class="versions">
        <a class="version" href="v2/" aria-label="Play Rooftop Coins version 2">
          <strong>PLAY V2</strong><span>The original game</span><em>CLASSIC</em>
        </a>
        <a class="version v3" href="v3/" aria-label="Play Rooftop Coins version 3">
          <strong>PLAY V3</strong><span>New graphics + upgrades</span><em>ENHANCED</em>
        </a>
        <a class="version v4" href="v4/" aria-label="Play Super Rooftop version 4">
          <strong>PLAY V4</strong><span>Levels, hazards + bonus time</span><em>SUPER ROOFTOP</em>
        </a>
      </div>
      <p class="note">V2, V3, and V4 stay playable separately. Updating one version will not change the others.</p>
    </section>
  </main>
</body>
</html>
